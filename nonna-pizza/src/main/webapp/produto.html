<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de produto - Nonna Pizza</title>
    <link rel="stylesheet" href="css/base.css">
</head>
<body>
<main>
    <h1>Cadastro de produto</h1>

    <form action="/create-produto" method="post">
        <label for="nome">Nome do produto</label>
        <input type="text" name="nome" id="nome" required>

        <label for="tipo">Tipo</label>
        <input type="text" name="tipo" id="tipo" placeholder="Ex: Bebida" required>

        <label for="valor">Preço (R$)</label>
        <input type="number" name="valor" id="valor" step="0.01" min="0.01" required>

        <label for="descricao">Descrição</label>
        <textarea name="descricao" id="descricao" rows="3"></textarea>

        <button type="submit" class="btn btn-primario">Cadastrar</button>
    </form>
</main>
</body>
</html>
