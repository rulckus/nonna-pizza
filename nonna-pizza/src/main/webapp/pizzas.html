<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de pizza - Nonna Pizza</title>
    <link rel="stylesheet" href="css/base.css">
</head>
<body>
<main>
    <h1>Cadastro de pizza</h1>

    <form action="/create-pizza" method="post">
        <label for="sabor">Sabor</label>
        <input type="text" name="sabor" id="sabor" required>

        <label for="tipo">Tipo</label>
        <input type="text" name="tipo" id="tipo" placeholder="Ex: Salgada" required>

        <label for="valor">Preço (R$)</label>
        <input type="number" name="valor" id="valor" step="0.01" min="0.01" required>

        <label for="descricao">Ingredientes</label>
        <textarea name="descricao" id="descricao" rows="3" required></textarea>

        <button type="submit" class="btn btn-primario">Cadastrar</button>
    </form>
</main>
</body>
</html>
