<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonna Pizza - Produção</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="layout">

    <!-- ===== MENU LATERAL ===== -->
    <aside class="sidebar">
        <div class="logo">
            <h1>Nonna Pizza</h1>
            <span>Painel Admin</span>
        </div>

        <nav class="menu">
            <a href="index.jsp">Cardápio</a>
            <a href="pedidos.html">Pedidos</a>
            <a href="producao.html" class="ativo">Produção</a>
        </nav>

        <div class="usuario">
            <div class="avatar">A</div>
            <div>
                <strong>Admin</strong>
                <a href="logout">Sair</a>
            </div>
        </div>
    </aside>

    <!-- ===== CONTEÚDO PRINCIPAL ===== -->
    <main class="conteudo">

        <header class="topo">
            <h2>Produção — Cozinha</h2>
            <p class="atualizado">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                Atualizado às <span id="hora">--:--</span>
            </p>
        </header>

        <div class="quadro">

            <section class="coluna coluna-recebido">
                <h3 class="coluna-topo">Recebido <span class="contador">0</span></h3>
                <div class="lista"></div>
            </section>

            <section class="coluna coluna-preparando">
                <h3 class="coluna-topo">Preparando <span class="contador">0</span></h3>
                <div class="lista"></div>
            </section>

            <section class="coluna coluna-assando">
                <h3 class="coluna-topo">Assando <span class="contador">0</span></h3>
                <div class="lista"></div>
            </section>

            <section class="coluna coluna-pronto">
                <h3 class="coluna-topo">Pronto para entrega <span class="contador">0</span></h3>
                <div class="lista"></div>
            </section>

        </div>
    </main>
</div>

<script src="js/app.js"></script>
<script src="js/producao.js"></script>
</body>
</html>
